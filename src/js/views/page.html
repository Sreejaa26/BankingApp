<div class="page-stack">
  <section class="page-introduction" data-bind="css: {'page-introduction--visual': heroImage}">
    <div><p class="page-eyebrow" data-bind="text: eyebrow"></p><h2 data-bind="text: title"></h2><p data-bind="text: description"></p></div>
    <button class="primary-page-button" type="button" data-bind="text: action"></button>
    <figure class="page-introduction__visual" data-bind="visible: heroImage">
      <img data-bind="attr: {src: heroImage, alt: heroAlt}">
    </figure>
  </section>

  <section class="metric-grid metric-grid--compact" data-bind="foreach: highlights">
    <article class="metric-card" data-bind="css: {'metric-card--primary': $index() === 0}">
      <span data-bind="text: label"></span><strong data-bind="text: value"></strong><small data-bind="text: $index() === 0 ? 'Updated moments ago' : 'Current overview'"></small>
    </article>
  </section>

  <section class="workspace-grid">
    <article class="surface-card workspace-panel">
      <div class="card-heading"><div><p class="page-eyebrow" data-bind="text: primaryEyebrow"></p><h3 data-bind="text: primaryTitle"></h3></div><button class="text-button" type="button">View all</button></div>
      <div class="workspace-list" data-bind="foreach: items">
        <div class="workspace-row">
          <span class="workspace-row__icon" data-bind="text: icon"></span>
          <div class="workspace-row__copy"><strong data-bind="text: name"></strong><small data-bind="text: meta"></small><div class="workspace-progress" data-bind="visible: progress != null"><span data-bind="style: {width: progress + '%'}"></span></div></div>
          <div class="workspace-row__value"><strong data-bind="text: value, css: {'amount-positive': positive}"></strong><small data-bind="text: status"></small></div>
        </div>
      </div>
    </article>

    <article class="surface-card workspace-panel">
      <div class="card-heading"><div><p class="page-eyebrow" data-bind="text: secondaryEyebrow"></p><h3 data-bind="text: secondaryTitle"></h3></div><span class="status-chip status-chip--positive">Live</span></div>
      <p class="workspace-panel__description" data-bind="text: secondaryCopy"></p>
      <div class="workspace-list" data-bind="foreach: secondaryItems">
        <div class="workspace-row">
          <span class="workspace-row__icon" data-bind="text: icon"></span>
          <div class="workspace-row__copy"><strong data-bind="text: name"></strong><small data-bind="text: meta"></small><div class="workspace-progress" data-bind="visible: progress != null"><span data-bind="style: {width: progress + '%'}"></span></div></div>
          <div class="workspace-row__value"><strong data-bind="text: value"></strong><small data-bind="text: status"></small></div>
        </div>
      </div>
      <div class="workspace-integration"><span aria-hidden="true">◇</span><p><strong>API-ready workspace</strong><small>Connect to <code data-bind="text: endpoint"></code> when live banking data is available.</small></p></div>
    </article>
  </section>
</div>
