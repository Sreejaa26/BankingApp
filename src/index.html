<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <title>Northstar Digital Banking</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1">
    <meta name="description" content="Northstar Digital Banking customer portal">
    <link rel="icon" href="styles/images/JET-Favicon-Red-32x32.png" type="image/x-icon">
    <!-- injector:theme -->
    <!-- endinjector -->
    <!-- injector:font -->
    <!-- endinjector:font -->
    <link rel="stylesheet" href="styles/app.css" type="text/css">
    <link rel="stylesheet" href="styles/theme.css" type="text/css">
  </head>
  <body class="oj-web-applayout-body">
    <div id="globalBody">
      <div data-bind="if: !isAuthenticated()">
        <oj-module config="[[authModuleConfig]]"></oj-module>
      </div>

      <div data-bind="if: isAuthenticated">
        <div class="app-shell app-shell--topnav">
          <aside class="side-navigation" data-bind="css: {'is-open': navigationOpen}" aria-label="Banking navigation">
            <button class="sidebar-close-button" type="button" aria-label="Close navigation" data-bind="visible: navigationOpen, click: closeNavigation"><span aria-hidden="true">&times;</span></button>
            <div class="brand brand--shell">
              <span class="brand-mark" aria-hidden="true">N</span>
              <span><strong>Northstar</strong><small>Digital Banking</small></span>
            </div>

            <div class="sidebar-account" data-bind="visible: !isAdmin()">
              <span class="sidebar-account__icon">₹</span>
              <div><small>Personal banking</small><strong>Northstar Premier</strong></div>
              <span class="sidebar-account__chevron">⌄</span>
            </div>

            <p class="navigation-label" data-bind="text: t('shell.workspace')"></p>
            <nav class="primary-navigation" data-bind="foreach: navigationItems">
              <button type="button"
                data-bind="click: $parent.navigate.bind($parent, route), css: {'is-active': $parent.activeRoute() === route}, attr: {'aria-current': $parent.activeRoute() === route ? 'page' : null}">
                <span class="nav-icon" aria-hidden="true" data-bind="text: icon"></span>
                <span data-bind="text: label"></span>
              </button>
            </nav>

            <div class="sidebar-help" role="button" tabindex="0" data-bind="visible: !isAdmin(), click: navigate.bind($data, 'support')">
              <span class="sidebar-help__icon">?</span>
              <div><strong data-bind="text: t('shell.needHelp')"></strong><small data-bind="text: t('shell.helpCopy')"></small></div>
              <span class="sidebar-help__arrow">›</span>
            </div>
          </aside>

          <button class="navigation-scrim" aria-label="Close navigation" data-bind="visible: navigationOpen, click: closeNavigation"></button>

          <div class="shell-content">
            <header class="banking-header">
              <div class="main-navigation-row">
                <div class="brand brand--topnav">
                  <span class="brand-mark" aria-hidden="true">N</span>
                  <span><strong>Northstar</strong><small>Digital Banking</small></span>
                </div>
                <button class="menu-toggle" type="button" aria-label="Open navigation" data-bind="click: openNavigation"><span></span><span></span><span></span></button>
                <nav class="top-navigation" aria-label="Primary navigation" data-bind="foreach: primaryNavigationItems">
                  <button type="button" data-bind="click: $parent.navigate.bind($parent, route), css: {'is-active': $parent.activeRoute() === route}, attr: {'aria-current': $parent.activeRoute() === route ? 'page' : null}">
                    <span data-bind="text: label"></span>
                  </button>
                </nav>
                <nav class="nav-utility-actions" aria-label="Support navigation" data-bind="visible: !isAdmin()">
                  <button type="button" data-bind="click: navigate.bind($data, 'support'), css: {'is-active': activeRoute() === 'support'}, text: t('shell.helpSupport')"></button>
                </nav>
                <div class="header-actions">
                  <label class="locale-switcher">
                    <span aria-hidden="true">文</span>
                    <select data-bind="options: languageOptions, optionsText: 'label', optionsValue: 'value', value: locale" aria-label="Language / भाषा"></select>
                  </label>
                  <label class="header-search"><span aria-hidden="true">⌕</span><input type="search" data-bind="attr: {placeholder: t('shell.search'), 'aria-label': t('shell.search')}"><kbd>⌘ K</kbd></label>
                  <button class="header-icon-button" type="button" aria-label="View notifications" data-bind="visible: !isAdmin(), click: navigate.bind($data, 'notifications')"><span aria-hidden="true">◌</span><i></i></button>
                  <button class="customer-summary" type="button" aria-label="Open profile" data-bind="visible: !isAdmin(), click: navigate.bind($data, 'profile')">
                    <span class="customer-copy"><strong data-bind="text: customerName"></strong><small data-bind="text: t('shell.primaryCustomer')"></small></span>
                  </button>
                  <div class="customer-summary" data-bind="visible: isAdmin">
                    <span class="customer-copy"><strong data-bind="text: customerName"></strong><small>Administrator</small></span>
                  </div>
                  <button class="signout-button" type="button" data-bind="click: logout" aria-label="Sign out">↪</button>
                </div>
              </div>

              <div class="page-title-bar">
                <div><p class="page-eyebrow" data-bind="text: t('shell.personalBanking')"></p><h1 data-bind="text: activeTitle"></h1></div>
                <span><span data-bind="text: t('shell.home')"></span>&nbsp; / &nbsp;<strong data-bind="text: activeTitle"></strong></span>
              </div>
            </header>

            <main class="page-content">
              <oj-module config="[[mainModuleConfig]]"></oj-module>
            </main>

            <footer class="app-footer">
              <span>© 2026 Northstar Bank</span>
              <span class="secure-session"><i></i><span data-bind="text: t('shell.secureSession')"></span></span>
              <nav aria-label="Legal links"><a href="#/privacy" data-bind="text: t('shell.privacy')"></a><a href="#/support" data-bind="text: t('shell.support')"></a></nav>
            </footer>
          </div>
        </div>
      </div>
    </div>
    <!-- injector:scripts -->
    <!-- endinjector -->
  </body>
</html>
